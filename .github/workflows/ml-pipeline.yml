name: Car Price ML Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: python -m pip install -r requirements.txt "dvc[s3]==3.67.1"

      - name: Pull dataset from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: python -m dvc pull

      - name: Train model and check accuracy
        run: python -u train.py

      - name: Build Docker image
        run: docker build -t car-price-mlops:${{ github.run_number }} .
